name: 缺陷报告
description: 有可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把信息填全，能复现的 issue 通常当天就能定位。
        **不要贴 API Key、访问令牌或会话 cookie**，日志里的 Key 请先抹成 `sk-***`。
        安全漏洞请走 [SECURITY.md](https://github.com/AiFLYF/FlyChat/blob/main/SECURITY.md) 的私密渠道，不要在这里公开。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 发生了什么？期望的结果是什么？
      placeholder: 发送长消息后回答中断，界面显示「网络不可达」；期望是继续输出或给出明确的上游错误。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，包括用的是哪个服务商与模型
      placeholder: |
        1. 设置里选择「智谱 GLM / glm-4-flash」
        2. 输入 2000 字并发送
        3. 约 10 秒后流中断
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - 本机开发（npm run dev）
        - 单端口生产（npm run build + npm start）
        - Docker / docker-compose
        - 反向代理之后（nginx / caddy / Cloudflare）
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      description: 页脚显示的版本号，或 `git rev-parse --short HEAD` 的输出
      placeholder: 0.1.0 / 9e5009b
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      description: `node -v` 的输出
      placeholder: v22.14.0
  - type: input
    id: provider
    attributes:
      label: 相关服务商与模型
      description: 例如 智谱 GLM / glm-4v-flash，或自定义的 OpenAI 兼容网关（不要填 Key 和完整 Base URL）
  - type: textarea
    id: logs
    attributes:
      label: 服务端日志
      description: 用 `LOG_LEVEL=debug` 重启后复现一次，粘贴相关片段（记得抹掉 Key）
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索过现有 issue，没有重复
          required: true
        - label: 内容里不含任何真实 API Key、令牌或密码
          required: true
