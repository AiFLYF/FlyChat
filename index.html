<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fly.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlyChat</title>
    <script>
      // 在页面加载前应用主题，避免闪烁
      const theme = localStorage.getItem('flychat-theme') || 'system'
      const dark =
        theme === 'dark' ||
        (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
